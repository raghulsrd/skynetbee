<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="5;url=https://www.skynetbee.org/skynetbee" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Redirecting...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    .box {
      text-align: center;
    }

    /* Spinner */
    .spinner {
      width: 80px;
      height: 80px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top: 4px solid #00d4ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 30px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h2 {
      font-size: 1.4rem;
      font-weight: 500;
      color: #eee;
      margin-bottom: 10px;
      letter-spacing: 0.05em;
    }

    p {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.4);
      margin-bottom: 28px;
    }

    /* Progress bar */
    .bar-track {
      width: 280px;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
      margin: 0 auto;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: #00d4ff;
      border-radius: 4px;
      animation: fill 5s linear forwards;
    }
    @keyframes fill {
      to { width: 100%; }
    }

    .count {
      margin-top: 14px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h2>Redirecting you...</h2>
    <p>Taking you to skynetbee.org</p>
    <div class="bar-track">
      <div class="bar-fill"></div>
    </div>
    <div class="count" id="count">5 seconds</div>
  </div>

  <script>
    let t = 5;
    const el = document.getElementById('count');
    const iv = setInterval(() => {
      t--;
      el.textContent = t + (t === 1 ? ' second' : ' seconds');
      if (t <= 0) {
        clearInterval(iv);
        window.location.href = 'https://www.skynetbee.org/skynetbee';
      }
    }, 1000);
  </script>
</body>
</html>
