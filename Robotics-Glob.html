<html lang="en">

    <style>
      * {
        margin: 0;
      }
      html,
      canvas {
        height: 100%;
      }

      body {
        background: #121212;
        overflow-x: hidden;

      body {
        font-family: "Great Vibes", cursive;

        color: white;
        font-size: 20px;
      }
      canvas {
        position: fixed;
        width: 100%;
        z-index: -10;
      }
      nav {
        width: 100%;
        backdrop-filter: blur(20px);
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
        box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.1);
      }

      nav ul {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      }

      nav li:first-child {

      }

      nav a {
        padding: 0 30px;

        display: flex;
        align-items: center;

      .sidebar {

      .section {

      .content-fit {

      .tagcloud-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 700px;
        height: 700px;
        pointer-events: none;
        z-index: 9999;
      }

      .tagcloud-wrapper {
        width: 100%;
        height: 100%;
        perspective: 1500px;
        overflow: visible;
        position: relative;
      }

      .tagcloud {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
      }

      .tag {
        position: absolute;
        top: 50%;
        left: 50%;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        font-size: 16px;
        white-space: nowrap;
        cursor: pointer;
        transition:
          transform 0.3s ease,
          color 0.3s ease;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .tag img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
      }

      .tag:hover {
        color: #ff0000;
        transform: scale(1.2);
        z-index: 9999 !important;
      }
      .tagcloud-container {

        width: 100px; /* further decreased size */
        height: 100px; /* further decreased size */

      .tagcloud-wrapper {

    <!-- Script -->
    <script>
      function showSidebar() {

      function hideSidebar() {
        document.getElementById("sidebar").style.display = "none";
      }

      const namesWithImages = [
        {
          name: "K. Yoga Shree",
          image:
            "https://raw.githubusercontent.com/Bhavana2628/IOT/refs/heads/main/IMG-20250618-WA0079.jpg",

        {

        },
        {
          name: "K. Barath",
          image:
            "https://raw.githubusercontent.com/Bhavana2628/IOT/refs/heads/main/IMG_20250623_120305.jpg",
        },
        {
          name: "P. Rithik",
          image:
            "https://raw.githubusercontent.com/Bhavana2628/IOT/refs/heads/main/IMG-20250618-WA0008.jpg",
        },
        {
          name: "G. Kesavan",
          image:
            "https://raw.githubusercontent.com/Bhavana2628/IOT/refs/heads/main/IMG-20250620-WA0009.jpg",
        },
        {
          name: "A. Taakifa",
          image:
            "https://raw.githubusercontent.com/Bhavana2628/IOT/refs/heads/main/IMG-20250618-WA0078.jpg",
        },
        {
          name: "G. Hemalatha",
          image:
            "https://raw.githubusercontent.com/Bhavana2628/IOT/refs/heads/main/IMG_20250623_120331.jpg",
        },
        {
          name: "K. Shakthi",
          image:
            "https://raw.githubusercontent.com/Bhavana2628/IOT/refs/heads/main/IMG_20250623_120410.jpg",
        },
        {
          name: "G. Devi Priya",
          image:
            "https://raw.githubusercontent.com/Bhavana2628/IOT/refs/heads/main/IMG-20250618-WA0073.jpg",
        },

        {
          name: "P. Sridharan",
          image:
            "https://raw.githubusercontent.com/Bhavana2628/IOT/refs/heads/main/IMG-20250618-WA0054.jpg",
        },
        {
          name: "S. Rathish",
          image:
            "https://raw.githubusercontent.com/Bhavana2628/IOT/refs/heads/main/IMG_20250623_120349.jpg",
        },
        {
          name: "P. Logeshwaran",
          image:
            "https://raw.githubusercontent.com/Bhavana2628/IOT/refs/heads/main/IMG-20250619-WA0006.jpg",
        },
        {
          name: "M. Boopalan",
          image:
            "https://raw.githubusercontent.com/Bhavana2628/IOT/refs/heads/main/IMG-20250618-WA0053.jpg",
        },
        {
          name: "V. Sudhakar",
          image:
            "https://raw.githubusercontent.com/Bhavana2628/IOT/refs/heads/main/IMG_20250623_122439.jpg",
        },
        {
          name: "E. Madhavan",
          image:
            "https://raw.githubusercontent.com/Bhavana2628/IOT/refs/heads/main/IMG_20250623_120430.jpg",
        },
      ];
      const container = document.getElementById("tagcloud");

      function getRadius() {
        return window.innerWidth <= 768 ? 210 : 350;
      }

      let tagsData = [];

      let visibleNames =
        window.innerWidth <= 768
          ? namesWithImages.slice(0, 20)
          : namesWithImages;

      function createTagCloud() {
        const radius = getRadius();
        tagsData = [];
        container.innerHTML = "";

        namesWithImages.forEach((item, i) => {
          const angleX = Math.acos(-1 + (2 * i) / namesWithImages.length);
          const angleY = Math.sqrt(namesWithImages.length * Math.PI) * angleX;

          const x = radius * Math.sin(angleX) * Math.cos(angleY);
          const y = radius * Math.sin(angleX) * Math.sin(angleY);
          const z = radius * Math.cos(angleX) * 0.8;

          tagsData.push({ x, y, z });

          const tag = document.createElement("a");
          tag.className = "tag";
          tag.href = "#";
          tag.style.transform = `translate3d(${x}px, ${y}px, ${z}px) translate(-50%, -50%)`;

          const img = document.createElement("img");
          img.src = item.image;
          img.alt = item.name;

          tag.appendChild(img);
          tag.appendChild(document.createTextNode(item.name));
          container.appendChild(tag);
        });
      }

      let angleX = 0,
        angleY = 0;

      function rotateCloud() {
        angleX += 0.05;
        angleY += 0.07;

        const radX = (angleX * Math.PI) / 180;
        const radY = (angleY * Math.PI) / 180;
        const tags = container.getElementsByClassName("tag");

        for (let i = 0; i < tags.length; i++) {
          const tag = tags[i];
          const pos = tagsData[i];

          let y = pos.y * Math.cos(radX) - pos.z * Math.sin(radX);
          let z = pos.y * Math.sin(radX) + pos.z * Math.cos(radX);
          let x = pos.x * Math.cos(radY) + z * Math.sin(radY);
          z = -pos.x * Math.sin(radY) + z * Math.cos(radY);

          tag.style.transform =
            z < 0
              ? `translate3d(${x}px, ${y}px, ${z}px) rotateY(180deg) translate(-50%, -50%)`
              : `translate3d(${x}px, ${y}px, ${z}px) translate(-50%, -50%)`;

          tag.style.zIndex = z < 0 ? 0 : 1;
          tag.style.opacity = z < 0 ? 0.5 : 1;
        }

        requestAnimationFrame(rotateCloud);
      }

      createTagCloud();
      rotateCloud();

      window.addEventListener("resize", () => {
        createTagCloud();
      });
      <!-- 💥 Neon Background JS -->

      Object.getOwnPropertyNames(Math).map(function (p) {
        window[p] = Math[p];
      });

      var HEX_CRAD = 32,
        HEX_BG = "#171717",
        HEX_HL = "#2a2a2a",
        HEX_HLW = 2,
        HEX_GAP = 4,
        NEON_PALETE = ["#ffc100"],
        T_SWITCH = 64,
        unit_x = 3 * HEX_CRAD + HEX_GAP * sqrt(3),
        unit_y = HEX_CRAD * sqrt(3) * 0.5 + 0.5 * HEX_GAP,
        off_x = 1.5 * HEX_CRAD + HEX_GAP * sqrt(3) * 0.5,
        wp = NEON_PALETE.map(function (c) {
          var num = parseInt(c.replace("#", ""), 16);
          return { r: (num >> 16) & 0xff, g: (num >> 8) & 0xff, b: num & 0xff };
        }),
        nwp = wp.length,
        csi = 0,
        f = 1 / T_SWITCH,
        c = document.querySelectorAll("canvas"),
        n = c.length,
        w,
        h,
        _min,
        ctx = [],
        grid,
        source = null,
        t = 0;

      var GridItem = function (x, y) {
        this.x = x || 0;
        this.y = y || 0;
        this.points = { hex: [], hl: [] };
        this.init = function () {
          var ri = HEX_CRAD - 0.5 * HEX_HLW,
            ba = PI / 3,
            x,
            y,
            a;
          for (var i = 0; i < 6; i++) {
            a = i * ba;
            x = this.x + HEX_CRAD * cos(a);
            y = this.y + HEX_CRAD * sin(a);
            this.points.hex.push({ x, y });
            if (i > 2) {
              x = this.x + ri * cos(a);
              y = this.y + ri * sin(a);
              this.points.hl.push({ x, y });
            }
          }
        };
        this.draw = function (ct) {
          for (var i = 0; i < 6; i++) {
            ct[(i === 0 ? "move" : "line") + "To"](
              this.points.hex[i].x,
              this.points.hex[i].y,
            );
          }
        };
        this.highlight = function (ct) {
          for (var i = 0; i < 3; i++) {
            ct[(i === 0 ? "move" : "line") + "To"](
              this.points.hl[i].x,
              this.points.hl[i].y,
            );
          }
        };
        this.init();
      };

      var Grid = function (rows, cols) {
        this.cols = cols || 16;
        this.rows = rows || 16;
        this.items = [];
        this.n = 0;
        this.init = function () {
          for (var row = 0; row < this.rows; row++) {
            var y = row * unit_y;
            for (var col = 0; col < this.cols; col++) {
              var x = (row % 2 == 0 ? 0 : off_x) + col * unit_x;
              this.items.push(new GridItem(x, y));
            }
          }
          this.n = this.items.length;
        };
        this.draw = function (ct) {
          ct.fillStyle = HEX_BG;
          ct.beginPath();
          for (var i = 0; i < this.n; i++) this.items[i].draw(ct);
          ct.closePath();
          ct.fill();

          ct.strokeStyle = HEX_HL;
          ct.beginPath();
          for (var i = 0; i < this.n; i++) this.items[i].highlight(ct);
          ct.closePath();
          ct.stroke();
        };
        this.init();
      };

      var init = function () {
        var s = getComputedStyle(c[0]),
          rows,
          cols;
        w = ~~s.width.split("px")[0];
        h = ~~s.height.split("px")[0];
        _min = 0.75 * min(w, h);
        rows = ~~(h / unit_y) + 2;
        cols = ~~(w / unit_x) + 2;
        for (var i = 0; i < n; i++) {
          c[i].width = w;
          c[i].height = h;
          ctx[i] = c[i].getContext("2d");
        }
        grid = new Grid(rows, cols);
        grid.draw(ctx[1]);
        if (!source) source = { x: ~~(w / 2), y: ~~(h / 2) };
        neon();
      };

      var neon = function () {
        var k = (t % T_SWITCH) * f,
          rgb = {
            r: ~~(wp[csi].r * (1 - k) + wp[(csi + 1) % nwp].r * k),
            g: ~~(wp[csi].g * (1 - k) + wp[(csi + 1) % nwp].g * k),
            b: ~~(wp[csi].b * (1 - k) + wp[(csi + 1) % nwp].b * k),
          },
          rgb_str = "rgb(" + rgb.r + "," + rgb.g + "," + rgb.b + ")",
          light = ctx[0].createRadialGradient(
            source.x,
            source.y,
            0,
            source.x,
            source.y,
            0.875 * _min,
          ),
          stp = 0.5 - 0.5 * sin(7 * t * f) * cos(5 * t * f) * sin(3 * t * f);

        light.addColorStop(0, rgb_str);
        light.addColorStop(stp, "rgba(0,0,0,.03)");

        fillBackground("rgba(0,0,0,.02)");
        fillBackground(light);

        t++;
        if (t % T_SWITCH === 0) {
          csi = (csi + 1) % nwp;
          t = 0;
        }

        requestAnimationFrame(neon);
      };

      var fillBackground = function (bg_fill) {
        ctx[0].fillStyle = bg_fill;
        ctx[0].beginPath();
        ctx[0].rect(0, 0, w, h);
        ctx[0].closePath();
        ctx[0].fill();
      };

      init();
      addEventListener("resize", init, false);
      addEventListener(
        "mousemove",
        function (e) {
          source = { x: e.clientX, y: e.clientY };
        },
        false,
      );
      // Mobile tap flip support for student card
      const studentCard = document.querySelector(".student-card");

      studentCard.addEventListener("click", () => {
        // Toggle flipped class on tap
        studentCard.classList.toggle("flipped");
      });
    </script>
