<style>
  .title {
    display: none;
    font-weight: bold;
    padding: 10px;
    width: 80%;
    margin: 10px;
    background: whitesmoke;
    border-radius: 10px;
  }
  .col {
    margin-left: 22%;
    padding-top: 10px;
    margin-right: 11%;
  }
  label {
    font-size: 20px;
  }
  video {
    width: 80%;
  }
  .mob {
    height: 60%;
  }
  p {
    font-size: 15px;
  }
  .alert h4 {
    margin-top: 20px;
    font-size: x-large;
    text-align: center;
  }
  .panel-heading {
    font-size: large;
    text-align: center;
  }
  .names {
    color: #337ab7;
  }
  .names:hover {
    text-decoration: underline;
  }
  .btn {
    white-space: inherit;
  }
  /* click to View */
  .title:target {
    display: block;
  }
  /* Style The Dropdown Button */
</style>
<html lang="en">
  <head>

                <li><a href="#ffox">FireFox</a></li>

            </div>

            </div>
            <div id="ffox" class="ffoxvid title">

            <div id="edge" class="edgevid title">
